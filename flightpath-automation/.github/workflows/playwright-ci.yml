# .github/workflows/playwright-ci.yml
# FlightPath Automation — CI/CD Pipeline
#
# Triggers:
#   - Push to main / develop branches
#   - Pull requests to main
#   - Daily scheduled run (6am IST = 12:30am UTC)
#   - Manual dispatch with browser choice

name: 🎭 Playwright Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'    # Daily 6:00 AM IST
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit, all]
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options: [all, e2e, api, visual, smoke, regression]

env:
  BASE_URL:     ${{ secrets.BASE_URL || 'https://www.saucedemo.com' }}
  API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://restful-booker.herokuapp.com' }}
  ENV:          ${{ secrets.ENV || 'ci' }}

jobs:

  # ── Install & Cache ──────────────────────────────────────────────────────────
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install browser deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

  # ── E2E Tests ────────────────────────────────────────────────────────────────
  e2e-tests:
    name: 🌐 E2E Tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser deps
        run: npx playwright install-deps

      - name: Create auth directory
        run: mkdir -p fixtures/.auth

      - name: Run E2E Tests — ${{ matrix.browser }}
        run: npx playwright test tests/e2e/ --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            playwright-report/
            allure-results/
          retention-days: 30

  # ── API Tests ─────────────────────────────────────────────────────────────────
  api-tests:
    name: 🔌 API Tests
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser deps
        run: npx playwright install-deps

      - name: Run API Tests
        run: npx playwright test tests/api/ --project=api
        env:
          CI: true

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: allure-results/
          retention-days: 30

  # ── Visual Regression ─────────────────────────────────────────────────────────
  visual-tests:
    name: 👁️ Visual Regression
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Restore Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser deps
        run: npx playwright install-deps

      - name: Create auth directory
        run: mkdir -p fixtures/.auth

      - name: Run Visual Tests
        run: npx playwright test tests/visual/ --project=visual
        env:
          CI: true

      - name: Upload visual diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report/
            tests/visual/__snapshots__/
          retention-days: 30

  # ── Allure Report ─────────────────────────────────────────────────────────────
  publish-report:
    name: 📊 Publish Allure Report
    runs-on: ubuntu-latest
    needs: [e2e-tests, api-tests, visual-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Merge allure results
        run: |
          mkdir -p allure-results
          find all-results/ -name "*.json" -o -name "*.xml" | xargs -I{} cp {} allure-results/ 2>/dev/null || true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report:  allure-report
          gh_pages:       gh-pages
          allure_history: allure-history

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir:    allure-history

  # ── Notify on Failure ─────────────────────────────────────────────────────────
  notify:
    name: 🔔 Notify on Failure
    runs-on: ubuntu-latest
    needs: [e2e-tests, api-tests, visual-tests]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Tests failed on branch ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          # Add Slack/Teams webhook call here in real projects
